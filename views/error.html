<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | LearnSphere Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-app);">
  <div style="text-align: center; max-width: 450px; padding: 2rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-light); box-shadow: var(--shadow-md);">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🔍</div>
    <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">404 - Page Not Found</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
      The page or view you are attempting to access does not exist in the LearnSphere portal.
    </p>
    <a href="/dashboard" class="btn btn-primary" style="display: inline-block;">Return to Dashboard</a>
  </div>
</body>
</html>
